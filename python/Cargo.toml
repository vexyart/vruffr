# this_file: python/Cargo.toml
[package]
name = "vruffr-python"
version = "2.0.6"
edition = "2021"
rust-version = "1.70"
authors = ["VexyArt <vexyart@proton.me>"]
description = "Python bindings for vruffr sketch renderer"
repository = "https://github.com/vexyart/vruffr"
license = "MIT"
publish = false

[lib]
name = "vruffr"
crate-type = ["cdylib"]

[dependencies]
vruffr-lib = { path = "../cli", package = "vruffr-cli" }
pyo3 = { version = "0.24", features = ["extension-module"] }
