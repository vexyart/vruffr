# this_file: python/Cargo.toml
[package]
name = "vruffr-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for vruffr sketch renderer"
license = "MIT"
publish = false

[lib]
name = "vruffr"
crate-type = ["cdylib"]

[dependencies]
vruffr-lib = { path = "../cli", package = "vruffr-cli" }
pyo3 = { version = "0.22", features = ["extension-module"] }
