# this_file: python/Cargo.toml
[package]
name = "vruffr-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for vruffr sketch renderer"
license = "MIT"
publish = false

[lib]
name = "vruffr"
crate-type = ["cdylib"]

[dependencies]
roughr = { path = "../roughr" }
rough_tiny_skia = { path = "../rough_tiny_skia" }
pyo3 = { version = "0.22", features = ["extension-module"] }
usvg = "0.45"
tiny-skia = "0.11"
