<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vruffr Playground</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --primary: #7c3aed;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1rem 2rem;
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        header h1 { font-size: 1.5rem; }
        header p { color: var(--muted); font-size: 0.875rem; }
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 300px 1fr;
            gap: 1rem;
            padding: 1rem;
        }
        .panel {
            background: var(--surface);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .panel h2 {
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: var(--text);
            font-family: 'Menlo', 'Monaco', monospace;
            font-size: 0.875rem;
            padding: 0.75rem;
            resize: none;
        }
        .controls { gap: 0.75rem; display: flex; flex-direction: column; }
        .control-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
        .control-group select {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: var(--text);
        }
        .value {
            float: right;
            color: var(--primary);
            font-size: 0.75rem;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .output-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }
        .output-area img, .output-area svg {
            max-width: 100%;
            max-height: 100%;
        }
        #status {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }
        .loading { color: var(--primary); }
        .error { color: #ef4444; }
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>vruffr Playground</h1>
        <p>Transform SVG to hand-drawn sketch style in your browser</p>
    </header>
    <main>
        <div class="panel">
            <h2>Input SVG</h2>
            <textarea id="svg-input" placeholder="Paste SVG here..."><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="160" height="160" rx="10" fill="#7c3aed" stroke="#1a1a2e" stroke-width="2"/>
  <circle cx="100" cy="100" r="50" fill="#fbbf24" stroke="#1a1a2e" stroke-width="2"/>
</svg></textarea>
        </div>
        <div class="panel controls">
            <h2>Options</h2>
            <div class="control-group">
                <label>Roughness <span class="value" id="roughness-val">1.0</span></label>
                <input type="range" id="roughness" min="0" max="5" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>Bowing <span class="value" id="bowing-val">1.0</span></label>
                <input type="range" id="bowing" min="0" max="5" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>Fill Style</label>
                <select id="fill-style">
                    <option value="crosshatch">Crosshatch</option>
                    <option value="hachure">Hachure</option>
                </select>
            </div>
            <div class="control-group">
                <label>Hachure Angle <span class="value" id="angle-val">-41°</span></label>
                <input type="range" id="hachure-angle" min="-90" max="90" step="1" value="-41">
            </div>
            <div class="control-group">
                <label>Hachure Gap <span class="value" id="gap-val">4.0</span></label>
                <input type="range" id="hachure-gap" min="1" max="20" step="0.5" value="4.0">
            </div>
            <div class="control-group">
                <label>Seed</label>
                <input type="number" id="seed" value="42" min="0" style="width:100%;padding:0.5rem;background:var(--bg);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:var(--text);">
            </div>
            <button id="render-btn">Render Sketch</button>
            <div id="status">Ready. Load WASM module to begin.</div>
        </div>
        <div class="panel">
            <h2>Output</h2>
            <div class="output-area" id="output">
                <p style="color:var(--muted)">Output will appear here</p>
            </div>
        </div>
    </main>
    <script type="module">
        // Slider value display
        const sliders = [
            ['roughness', 'roughness-val', v => v],
            ['bowing', 'bowing-val', v => v],
            ['hachure-angle', 'angle-val', v => v + '°'],
            ['hachure-gap', 'gap-val', v => v],
        ];
        sliders.forEach(([id, valId, fmt]) => {
            const el = document.getElementById(id);
            const val = document.getElementById(valId);
            el.addEventListener('input', () => val.textContent = fmt(el.value));
        });

        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const btn = document.getElementById('render-btn');

        // WASM loading placeholder
        let wasm = null;

        async function initWasm() {
            status.textContent = 'Loading WASM module...';
            status.className = 'loading';
            try {
                // TODO: Replace with actual WASM import when built
                // wasm = await import('./vruffr_wasm.js');
                // await wasm.default();
                status.textContent = 'WASM not yet available. Build with: cd wasm && wasm-pack build';
                status.className = '';
            } catch (e) {
                status.textContent = 'WASM module not found. See docs for build instructions.';
                status.className = 'error';
            }
        }

        btn.addEventListener('click', async () => {
            if (!wasm) {
                status.textContent = 'WASM not loaded. This is a demo placeholder.';
                status.className = 'error';
                // Demo: just display input SVG
                output.innerHTML = document.getElementById('svg-input').value;
                return;
            }

            const svg = document.getElementById('svg-input').value;
            const options = {
                roughness: parseFloat(document.getElementById('roughness').value),
                bowing: parseFloat(document.getElementById('bowing').value),
                fill_style: document.getElementById('fill-style').value,
                hachure_angle: parseInt(document.getElementById('hachure-angle').value),
                hachure_gap: parseFloat(document.getElementById('hachure-gap').value),
                seed: parseInt(document.getElementById('seed').value),
            };

            status.textContent = 'Rendering...';
            status.className = 'loading';

            try {
                const result = wasm.render_to_svg(svg, options);
                output.innerHTML = result;
                status.textContent = 'Done!';
                status.className = '';
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
                status.className = 'error';
            }
        });

        initWasm();
    </script>
</body>
</html>
