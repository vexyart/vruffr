# this_file: wasm/Cargo.toml
[package]
name = "vruffr-wasm"
version = "2.0.4"
edition = "2021"
authors = ["VexyArt <vexyart@proton.me>"]
description = "WASM bindings for vruffr sketch renderer"
repository = "https://github.com/vexyart/vruffr"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vruffr = { path = "../cli", package = "vruffr-cli" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
