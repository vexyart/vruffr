# this_file: wasm/Cargo.toml
[package]
name = "vruffr-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for vruffr sketch renderer"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roughr = { path = "../roughr" }
rough_tiny_skia = { path = "../rough_tiny_skia" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
usvg = "0.45"
tiny-skia = "0.11"

[profile.release]
opt-level = "s"
lto = true
