[package]
name = "vruffr-core"
version = "2.0.6"
edition = "2021"
authors = ["VexyArt <vexyart@proton.me>"]
description = "Core sketch primitives for hand-drawn style rendering (Rough.js port)"
repository = "https://github.com/vexyart/vruffr"
homepage = "https://github.com/vexyart/vruffr"
keywords = ["graphics", "sketch", "hand-drawn", "roughjs"]
categories = ["graphics", "rendering"]
license = "MIT"
readme = "README.md"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
points_on_curve = { path = "../points_on_curve", version = "0.7.0" }
svg_path_ops = { path = "../svg_path_ops", version = "0.11.0" }
euclid = "0.22"
rand = "0.8"
num-traits = "0.2"
derive_builder = "0.12"
svgtypes = "0.11"
palette = "0.7"

[dev-dependencies]
plotlib = "0.5"
