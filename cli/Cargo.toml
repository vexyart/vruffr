[package]
name = "vruffr-cli"
version = "2.0.5"
edition = "2021"
rust-version = "1.70"
authors = ["VexyArt <vexyart@proton.me>"]
description = "CLI tool to convert SVG to hand-drawn sketch-style PNG"
license = "MIT"
repository = "https://github.com/vexyart/vruffr"
homepage = "https://github.com/vexyart/vruffr"
keywords = ["svg", "sketch", "roughjs", "hand-drawn"]
categories = ["graphics", "command-line-utilities"]
readme = "../README.md"

[dependencies]
vruffr-core = { path = "../vruffr_core" }
vruffr-skia = { path = "../vruffr_tiny_skia" }
usvg = { version = "0.45", features = ["text", "system-fonts"] }
fontdb = "0.23"
tiny-skia = "0.11"
palette = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vruffr"
path = "src/main.rs"

[lib]
name = "vruffr"
path = "src/lib.rs"
