[package]
name = "vruffr-vello"
version = "2.0.5"
edition = "2021"
authors = ["Orhan Balci <orhanbalci@gmail.com>", "VexyArt <vexyart@proton.me>"]
description = "Vello GPU rendering backend for vruffr hand-drawn style graphics"
repository = "https://github.com/vexyart/vruffr"
homepage = "https://github.com/vexyart/vruffr"
keywords = ["graphics", "sketch", "hand-drawn", "vello"]
categories = ["graphics", "rendering"]
license = "MIT"
readme = "README.md"
rust-version = "1.70"

[dependencies]
vruffr-core = { path = "../vruffr_core", version = "2.0.5" }
num-traits = "0.2"
euclid = "0.22"
palette = "0.7"
vello = "0.5"

[dev-dependencies]
rand = "0.8"
rand_distr = "0.4"
svg_path_ops = { path = "../svg_path_ops", version = "0.11.0" }
bevy = "0.16"
bevy_vello = "0.10"
wgpu = "22"
