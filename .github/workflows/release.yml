# this_file: .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: vruffr-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: vruffr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: vruffr-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: vruffr-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p vruffr-cli

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/vruffr ${{ matrix.name }}
          chmod +x ${{ matrix.name }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/vruffr.exe ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  # Build universal macOS binary
  macos-universal:
    name: Build macOS Universal
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vruffr-macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: vruffr-macos-aarch64

      - name: Create universal binary
        run: |
          chmod +x vruffr-macos-x86_64 vruffr-macos-aarch64
          lipo -create vruffr-macos-x86_64 vruffr-macos-aarch64 -output vruffr-macos-universal
          chmod +x vruffr-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: vruffr-macos-universal
          path: vruffr-macos-universal

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, macos-universal]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/vruffr-linux-x86_64/vruffr-linux-x86_64
            artifacts/vruffr-macos-x86_64/vruffr-macos-x86_64
            artifacts/vruffr-macos-aarch64/vruffr-macos-aarch64
            artifacts/vruffr-macos-universal/vruffr-macos-universal
            artifacts/vruffr-windows-x86_64.exe/vruffr-windows-x86_64.exe
          generate_release_notes: true
