[package]
name = "vruffr-skia"
version = "2.0.5"
edition = "2021"
authors = ["VexyArt <vexyart@proton.me>"]
description = "tiny-skia rendering backend for vruffr hand-drawn style graphics"
repository = "https://github.com/vexyart/vruffr"
homepage = "https://github.com/vexyart/vruffr"
keywords = ["graphics", "sketch", "hand-drawn", "tiny-skia"]
categories = ["graphics", "rendering"]
license = "MIT"
readme = "README.md"
rust-version = "1.70"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
vruffr-core = { path = "../vruffr_core", version = "2.0.5" }
num-traits = "0.2"
euclid = "0.22"
palette = "0.7"
tiny-skia = "0.11"
