[package]
name = "vruffr-piet"
version = "2.0.5"
edition = "2021"
authors = ["Orhan Balci <orhanbalci@gmail.com>", "VexyArt <vexyart@proton.me>"]
description = "Piet rendering backend for vruffr hand-drawn style graphics"
repository = "https://github.com/vexyart/vruffr"
homepage = "https://github.com/vexyart/vruffr"
keywords = ["graphics", "sketch", "hand-drawn", "piet"]
categories = ["graphics", "rendering"]
license = "MIT"
readme = "README.md"
rust-version = "1.70"

[dependencies]
vruffr-core = { path = "../vruffr_core", version = "2.0.5" }
num-traits = "0.2"
euclid = "0.22"
piet = "0.8"
palette = "0.7"

[dev-dependencies]
piet-common = { version = "0.8", features = ["png"] }
rand = "0.8"
rand_distr = "0.4"
svg_path_ops = { path = "../svg_path_ops", version = "0.11.0" }
text2v = { git = "https://github.com/orhanbalci/text2v" }
